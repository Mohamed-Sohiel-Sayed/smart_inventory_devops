# Nginx: serves the dashboard and reverse-proxies the two APIs.
server {
    listen 80;

    # Dashboard (static files)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /api/items -> inventory:3000/items
    location /api/ {
        proxy_pass http://inventory:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /alerts -> alert:4000/alerts
    location /alerts {
        proxy_pass http://alert:4000/alerts;
        proxy_set_header Host $host;
    }
}
